<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="“My Autobiography” is the world’s first digital legacy archive designed to share & preserve your life stories, memories & experiences across generations.">

  <!-- Social preview (WhatsApp, LinkedIn, Facebook, X) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="My Autobiography">
  <meta property="og:title" content="My Autobiography">
  <meta property="og:description" content="The world's first digital legacy archive to share & preserve your life stories across generations.">
  <meta property="og:url" content="https://myautobiography.com">
  <meta property="og:image" content="https://myautobiography.com/og-image.png?v=2">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="My Autobiography">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="My Autobiography">
  <meta name="twitter:description" content="The world's first digital legacy archive to share & preserve your life stories across generations.">
  <meta name="twitter:image" content="https://myautobiography.com/og-image.png?v=2">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="My Autobiography">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="96x96" href="favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png">
  <title>My Autobiography</title>
  <link rel="manifest" href="manifest.json">
  <!-- Desktop onboarding hero; fetched during the intro so it is ready at the reveal. -->
  <link rel="preload" as="image" href="https://dl9325jolfmzn.cloudfront.net/assets/image1.png" media="(min-width: 901px)">

  <!--
    Intro shown until Flutter paints its first frame: the logo rises out of the
    dark with a gold light sweep while the app loads, then a gun-barrel iris
    opens from the centre and the logo zooms past the screen edges to reveal
    onboarding.
  -->
  <style>
    /* Radius of the iris hole; registered so it can be animated. */
    @property --iris { syntax: '<length>'; inherits: true; initial-value: 0px; }

    html, body { margin: 0; height: 100%; background: #000; }
    #app-intro {
      position: fixed; inset: 0; z-index: 2147483647; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      background: #000;
    }
    #app-intro .logo {
      position: relative; width: min(72vw, 44vh, 360px); aspect-ratio: 720 / 1018;
      opacity: 0; transform: scale(0.88); filter: brightness(0.3) blur(6px);
    }
    #app-intro .logo img { display: block; width: 100%; height: 100%; }
    /* Light sweep; color-dodge leaves the black background black. */
    #app-intro .shine {
      position: absolute; inset: 0; mix-blend-mode: color-dodge;
      background: linear-gradient(105deg, transparent 38%, rgba(255, 232, 180, 0.8) 50%, transparent 62%)
                  150% 0 / 250% 100% no-repeat;
    }
    #app-intro .ring {
      position: absolute; left: 50%; top: 50%; border-radius: 50%; opacity: 0;
      width: calc(var(--iris) * 2 + 6px); height: calc(var(--iris) * 2 + 6px);
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 2px #c18e3b, 0 0 28px 8px rgba(193, 142, 59, 0.55);
    }

    /* 1. Logo loaded: rise out of the dark, then sweep light while waiting. */
    #app-intro.ready .logo { animation: intro-in 1.4s cubic-bezier(0.2, 0.7, 0.2, 1) forwards; }
    #app-intro.ready .shine { animation: intro-shine 3.2s 1.1s ease-in-out infinite; }

    /* 2. Flutter ready: iris opens, logo zooms out past the edges. */
    #app-intro.reveal {
      pointer-events: none;
      -webkit-mask-image: radial-gradient(circle at 50% 50%, transparent var(--iris), #000 calc(var(--iris) + 1px));
              mask-image: radial-gradient(circle at 50% 50%, transparent var(--iris), #000 calc(var(--iris) + 1px));
      animation: intro-iris 1.1s 0.3s cubic-bezier(0.65, 0, 0.35, 1) forwards;
    }
    #app-intro.reveal .ring { opacity: 1; }
    #app-intro.reveal .logo { animation: intro-zoom 1.2s cubic-bezier(0.5, 0, 0.75, 0) forwards; }
    #app-intro.reveal .shine { animation: none; }
    /* Fallback for browsers that can't animate --iris, and reduced motion. */
    #app-intro.reveal-fade { pointer-events: none; transition: opacity 0.45s ease; opacity: 0; }

    @keyframes intro-in { to { opacity: 1; transform: scale(1); filter: none; } }
    @keyframes intro-shine {
      0% { background-position: 150% 0; }
      45%, 100% { background-position: -50% 0; }
    }
    @keyframes intro-iris { to { --iris: 80vmax; } }
    @keyframes intro-zoom {
      from { opacity: 1; transform: scale(1); filter: none; }
      70% { opacity: 1; }
      to { opacity: 0; transform: scale(9); filter: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      #app-intro.ready .logo { animation: none; opacity: 1; transform: none; filter: none; }
      #app-intro.ready .shine { animation: none; }
    }
  </style>
</head>
<body>
  <div id="app-intro" role="status" aria-label="Loading My Autobiography">
    <div class="logo">
      <img src="logo.png" alt="My Autobiography" fetchpriority="high">
      <div class="shine"></div>
    </div>
    <div class="ring"></div>
  </div>
  <script>
    (function () {
      var intro = document.getElementById('app-intro');
      var img = intro.querySelector('img');
      var MIN_SHOW_MS = 2200;   // let the logo be seen even when the app loads fast
      var SETTLE_MS = 300;      // give the onboarding background time to decode
      var REVEAL_MS = 1400;
      var shownAt = null;
      var revealed = false;

      function show() {
        if (shownAt !== null) return;
        shownAt = Date.now();
        intro.classList.add('ready');
      }
      if (img.complete) show();
      img.addEventListener('load', show);
      img.addEventListener('error', show);
      setTimeout(show, 1500);  // don't wait forever on a slow logo

      function reveal() {
        if (revealed) return;
        revealed = true;
        var iris = window.CSS && CSS.registerProperty &&
            !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        intro.classList.add(iris ? 'reveal' : 'reveal-fade');
        setTimeout(function () { intro.remove(); }, iris ? REVEAL_MS + 100 : 500);
      }

      window.addEventListener('flutter-first-frame', function () {
        show();
        setTimeout(reveal, Math.max(0, shownAt + MIN_SHOW_MS - Date.now()) + SETTLE_MS);
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
